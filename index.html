<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>PRÁZDNÁ KORUNA – demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #555; font: 14px monospace; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="view" width="320" height="240"></canvas>
    <canvas id="ui" width="640" height="480"></canvas>
    <div id="loading">ČTENÍ DISKU...</div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
